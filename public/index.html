<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reconnecting Incident Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      background: #f4f5f7;
    }

    body {
      max-width: 660px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e4e9;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }

    /* status pill */
    #status {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    #status[data-state="connected"]    { background: #dcfce7; color: #166534; }
    #status[data-state="connecting"],
    #status[data-state="reconnecting"] { background: #fef9c3; color: #854d0e; }
    #status[data-state="disconnected"] { background: #fee2e2; color: #991b1b; }

    /* room row */
    .row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    label {
      align-self: center;
      font-size: 0.875rem;
      color: #555;
      white-space: nowrap;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.45rem 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

    button {
      padding: 0.45rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #374151;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: #f3f4f6; border-color: #9ca3af; }

    button[type="submit"] {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }
    button[type="submit"]:hover { background: #4f46e5; border-color: #4f46e5; }

    /* message list */
    ul#messages {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem;
      height: 320px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
    }

    ul#messages li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 0.75rem;
      align-items: baseline;
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    ul#messages li:last-child { border-bottom: none; }

    ul#messages li .meta {
      font-size: 0.75rem;
      color: #9ca3af;
      white-space: nowrap;
    }

    ul#messages li .body { color: #1a1a1a; }

    /* hint */
    .hint {
      margin-top: 0.9rem;
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1> Incident Feed</h1>
      <span id="status" data-state="connecting">connecting</span>
    </header>

    <div class="row">
      <label for="room-input">Room</label>
      <input id="room-input" type="text" value="demo-room" />
      <button id="connect-btn" type="button">Connect</button>
    </div>

    <ul id="messages"></ul>

    <form id="publish-form" class="row" style="margin-bottom:0">
      <input id="content-input" type="text" placeholder="Type something and press Enter" autocomplete="off" />
      <button type="submit">Publish</button>
    </form>

    <p class="hint">
      Open in two tabs with the same room name to see live updates.
      Go offline in DevTools (Network → Offline) to simulate a dropped connection.
    </p>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
